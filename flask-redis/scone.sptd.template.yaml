# sptd-mode variant of scone.template.yaml, read only by the sptd dispatcher. Only the redis server
# is registered: flask-api, a measured CPython script target, also needs its /tls Secret baked and
# stays as it is in sptd mode for now. k8s/secret-redis-tls.yaml (README step 4) is baked into redis's
# launcher. k8s/secret-flask-tls.yaml, which only flask-api mounts, is applied as a plain Secret (not
# baked): the README deletes both TLS Secrets before the confidential deployment, so the sanitized
# manifest must bring flask-tls back (tests/sptd-apply-secrets.test.sh).
apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: flask-redis-demo
spec:
  source-image: redis:7-bookworm
  reference-image: redis:7-bookworm
  output-image: ${IMAGE_NAME}-redis-scone
  protected-binaries: ["/usr/local/bin/redis-server"]
  push-image: true
  tee-type: ${TEE_TYPE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: flask-redis-demo
spec:
  file:
    - "k8s/manifest.yaml"
    - "k8s/secret-flask-tls.yaml"
    - "k8s/secret-redis-tls.yaml"
  output-manifest: "manifest.prod.sanitized.yaml"
  output-session: "manifest.prod.session.yaml"
  cas-endpoint:
    address: ${CAS_ENDPOINT}
  cas-policy-env:
    - {name: SCONE_VERSION, value: "1"}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2" }
  permissive: true
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  access_policy:
    read:
      - ANY
    update:
      - signer: |
          ${SIGNER}
    create_sessions:
      - signer: |
          ${SIGNER}
