apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: image-signing-example
spec:
  source-image: ${IMAGE_NAME}
  reference-image: rust:latest
  output-image: ${DESTINATION_IMAGE_NAME}
  scone-version: ${SCONE_RUNTIME_VERSION}
  tee-type: ${TEE_TYPE}
  image-signing-key: "config/image-signing-key.private"
  signing-key-passphrase-file: "config/empty-passphrase.txt"
  registry-auth-file: "${REPO_CREDENTIALS}"
  container-env:
    - {name: SCONE_PRODUCTION, value: "0"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: image-signing-example
spec:
  scone-version: ${SCONE_RUNTIME_VERSION}
  file:
    - "manifest.job.yaml"
  output-manifest: "manifest.job.sanitized.yaml"
  output-session: "manifest.job.session.yaml"
  cas-endpoint:
    address: ${CAS_ENDPOINT}
  cas-policy-env:
    - {name: SCONE_VERSION, value: "1"}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "1G"}
  permissive: true
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
