# SDV-026 SPTD variant of manifest.template.yaml for the scone-sptd-build offline compiler.
# Only change: the two subPath mounts (ConfigMap key configs.yaml at
# /config/configs.yaml, Secret key secrets at /config/secrets) become ONE read-only
# mount of a projected volume at /config that selects the same keys under the same
# file names, so Main.java still reads /config/configs.yaml and /config/secrets.
# scone-sptd-build refuses subPath mounts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: java-cli-env-config
  namespace: ${NAMESPACE}
data:
  configs.yaml: |
    key1: value1
    key2: value2
---
apiVersion: v1
kind: Secret
metadata:
  name: java-cli-env-secret
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  secrets: |
    password: s3cr3t
    my_db_encryption_key: top_secret_key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-args-env-file
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-args-env-file
  template:
    metadata:
      labels:
        app: java-args-env-file
    spec:
      containers:
        - name: java-cli-env
          image: ${DEMO_IMAGE}
          imagePullPolicy: Always
          command: ["/opt/java/openjdk/bin/java", "Main"]
          args: ["arg1", "arg2"]
          ports:
          - containerPort: 9999
            name: metrics
            protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /config
              readOnly: true
      imagePullSecrets:
        - name: ${IMAGE_PULL_SECRET_NAME}
      volumes:
        - name: config-volume
          projected:
            sources:
              - configMap:
                  name: java-cli-env-config
                  items:
                    - key: configs.yaml
                      path: configs.yaml
              - secret:
                  name: java-cli-env-secret
                  items:
                    - key: secrets
                      path: secrets
