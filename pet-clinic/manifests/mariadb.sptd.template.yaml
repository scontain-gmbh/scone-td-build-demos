# SDV-026 SPTD variant of mariadb.template.yaml for the scone-sptd-build offline compiler.
# Only changes: the db-data emptyDir is memory-backed (medium: Memory, sizeLimit 1Gi),
# the first protected writable-volume class (RFA-123), and the container memory limit
# is raised from 2Gi to 3Gi because tmpfs pages count against it. The sgx/cvm
# walkthrough keeps using mariadb.template.yaml (disk-backed, sizeLimit 1Gi).
# MariaDB runs natively (not confidential). It is the data store the confidential
# PetClinic connects to. Deployed directly with kubectl, outside the SCONE
# register/apply flow, so it keeps its normal entrypoint and initialisation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-db
  namespace: ${NAMESPACE}
  labels:
    app: petclinic-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-db
  template:
    metadata:
      labels:
        app: petclinic-db
    spec:
      containers:
        - name: petclinic-db
          image: ${MARIADB_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-db
                  key: root-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              # Above 2Gi: the 1Gi memory-backed db-data volume counts against it.
              memory: "3Gi"
              cpu: "1"
      volumes:
        - name: db-data
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-db
  namespace: ${NAMESPACE}
  labels:
    app: petclinic-db
spec:
  selector:
    app: petclinic-db
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
