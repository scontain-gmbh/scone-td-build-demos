apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: pet-clinic-demo
spec:
  source-image: ${IMAGE_NAME}
  output-image: ${DESTINATION_IMAGE_NAME}
  # Keep the skip-list minimal (static busybox): java is dynamically linked
  # against glibc (libpthread/libc/libdl) and dlopens the JRE .so libraries, so
  # its whole dependency tree must be sconified into the enclave link map. A
  # skip-list that includes the JRE base would drop those deps and the enclave
  # would fail with "libpthread ... not found in the enclave link map".
  reference-image: busybox
  protected-binaries: ["/opt/java/openjdk/bin/java"]
  push-image: true
  tee-type: ${TEE_TYPE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: pet-clinic-demo
spec:
  scone-version: ${SCONE_RUNTIME_VERSION}
  # MariaDB is deployed natively (see manifests/mariadb.yaml) and is intentionally not
  # part of the apply input. The Secret is included so apply can resolve
  # PetClinic's `secretKeyRef` datasource credentials into the confidential
  # session.
  file:
    - "manifests/secret.yaml"
    - "manifests/petclinic.yaml"
  output-manifest: "manifests/manifest.prod.sanitized.yaml"
  output-session: "manifests/manifest.prod.session.yaml"
  cas-endpoint:
    address: ${CAS_ENDPOINT}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
  permissive: true
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
  access_policy:
    read:
      - ANY
    update:
      - signer: |
          ${SIGNER}
    create_sessions:
      - signer: |
          ${SIGNER}
