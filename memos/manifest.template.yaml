apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
        - name: memos
          image: ${IMAGE_NAME}
          imagePullPolicy: Always
          command: ["/usr/local/bin/memos", "--port", "5230", "--data", "/var/opt/memos"]
          ports:
            - containerPort: 5230
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
      imagePullSecrets:
        - name: ${IMAGE_PULL_SECRET_NAME}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
---
apiVersion: v1
kind: Service
metadata:
  name: memos
  labels:
    app: memos
spec:
  selector:
    app: memos
  ports:
    - name: http
      protocol: TCP
      port: 5230
      targetPort: 5230
