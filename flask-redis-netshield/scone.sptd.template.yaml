# sptd-mode variant of scone.template.yaml, read only by the sptd dispatcher. Only flask-api is registered
# (a measured CPython script target); the redis server needs its ConfigMap baked and stays as it is in
# sptd mode for now. The Apply files leave out the two TLS Secret files, which no container here mounts
# and whose keys the README generates; offline onboarding creates no keys.
apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: flask-redis-demo
spec:
  source-image: ${IMAGE_NAME}
  reference-image: ${IMAGE_NAME}
  protected-binaries: ["/usr/local/bin/python"]
  push-image: true
  tee-type: ${TEE_TYPE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2" }
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: flask-redis-demo
spec:
  file:
    - "k8s/manifest.yaml"
  output-manifest: "manifest.prod.sanitized.yaml"
  output-session: "manifest.prod.session.yaml"
  cas-endpoint:
    address: ${CAS_ENDPOINT}
  cas-policy-env:
    - {name: SCONE_VERSION, value: "1"}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "${ENCLAVE_HEAP}"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2" }
  permissive: true
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  access_policy:
    read:
      - ANY
    update:
      - signer: |
          ${SIGNER}
    create_sessions:
      - signer: |
          ${SIGNER}
