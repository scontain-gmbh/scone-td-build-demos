# scone-td-build input: register the app image, then transform the manifest.
# The two Deployments share one PVC, so the Apply step re-shares it over NFS.
apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: nfs-shared-volume-demo
spec:
  source-image: ${IMAGE_NAME}
  reference-image: ${IMAGE_NAME}
  output-image: ${DESTINATION_IMAGE_NAME}
  protected-binaries: ["/usr/local/bin/python3"]
  push-image: true
  scone-version: ${SCONE_RUNTIME_VERSION}
  tee-type: ${TEE_TYPE}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "760M"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: nfs-shared-volume-demo
  namespace: ${NAMESPACE}
spec:
  file:
    - "manifests/manifest.yaml"
  output-manifest: "manifests/manifest.sanitized.yaml"
  output-session: "manifests/manifest.session.yaml"
  cas-endpoint:
    address: ${CAS_ENDPOINT}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "760M"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
  scone-version: ${SCONE_RUNTIME_VERSION}
  permissive: true
  # The PVC is mounted by two workloads, so scone-td-build re-exports it over
  # NFS. The server that does so is not attested yet, and accepting that is
  # deliberate rather than implied.
  shared-volumes:
    unattested-server: true
  # Signed policy (spol) instead of encrypted: skips CAS attestation and policy
  # encryption, so the setup host needs no SGX2. Only the cluster nodes running
  # the transformed manifest need SGX. See README "How the security posture is set".
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
