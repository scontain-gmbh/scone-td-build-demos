apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: software-updates-demo
spec:
  protected_image: ${IMAGE_NAME_V2}
  unprotected_image: ${IMAGE_NAME_V2}
  destination_image: ${DESTINATION_IMAGE_NAME_V2}
  enforce: ["/usr/local/bin/python3"]
  push_scone_image: true
  version: ${SCONE_RUNTIME_VERSION}
  scone_runtime_image: ${SCONE_RUNTIME_IMAGE}
  cvm: ${CVM_MODE}
  storage: "$DEMO_DIR/manifests/storage.json"
  manifest_env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "760M"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: software-updates-demo
  namespace: ${SESSION_NAMESPACE}
spec:
  file:
    - "$DEMO_DIR/manifests/scone-secret.yaml"
    - "$DEMO_DIR/manifests/manifest.v2.yaml"
  output_manifest_file: "$DEMO_DIR/manifests/manifest.prod.sanitized.yaml"
  output_session_file: "$DEMO_DIR/manifests/manifest.prod.session.yaml"
  cas_address: ${SCONE_CAS_ADDR}
  session_env:
    - {name: SCONE_VERSION, value: "1"}
  manifest_env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "760M"}
    - {name: SCONE_ALLOW_DLOPEN, value: "2"}
  version: ${SCONE_RUNTIME_VERSION}
  scone_runtime_image: ${SCONE_RUNTIME_IMAGE}
  trusted_cvm_signer_keys: ${CVM_SIGNING_KEY_FILE}
  permissive: true
  spol: true
  cvm: ${CVM_MODE}
  scone_enclave: ${SCONE_ENCLAVE}
