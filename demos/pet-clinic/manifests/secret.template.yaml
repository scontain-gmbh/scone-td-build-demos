apiVersion: v1
kind: Secret
metadata:
  # No explicit namespace: scone-td-build resolves `secretKeyRef` lookups by the
  # bare `<secret>-<key>` name, so a namespaced Secret would not be found. The
  # Secret lands in ${NAMESPACE} via `kubectl apply -n ${NAMESPACE}`.
  name: petclinic-db
type: Opaque
stringData:
  database: ${DB_NAME}
  username: ${DB_USER}
  password: ${DB_PASSWORD}
  root-password: ${DB_ROOT_PASSWORD}
