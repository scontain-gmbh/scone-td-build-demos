apiVersion: batch/v1
kind: Job
metadata:
  name: hello-world
spec:
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hello-world
          image: registry.scontain.com/cicd/daniel/hello-world:native
          imagePullPolicy: Always
      imagePullSecrets:
        - name: sconeapps
  backoffLimit: 4
