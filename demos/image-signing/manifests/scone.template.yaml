apiVersion: scone.cloud/v1
kind: Register
metadata:
  name: image-signing-example
spec:
  source-image: ${IMAGE_NAME}
  reference-image: rust:latest
  output-image: ${DESTINATION_IMAGE_NAME}
  push-image: true
  scone-version: ${SCONE_RUNTIME_VERSION}
  scone-runtime-image: ${SCONE_RUNTIME_IMAGE}
  storage: "manifests/storage.json"
  tee-type: ${TEE_TYPE}
  signing_key: "app/config/image-signing-key.private"
  signing_passphrase_file: "app/config/empty-passphrase.txt"
  repo_credentials: "${REPO_CREDENTIALS}"
  container-env:
    - {name: SCONE_PRODUCTION, value: "0"}
---
apiVersion: scone.cloud/v1
kind: Apply
metadata:
  name: image-signing-example
spec:
  file:
    - "manifests/manifest.job.yaml"
  output-manifest: "manifests/manifest.job.sanitized.yaml"
  output-session: "manifests/manifest.job.session.yaml"
  cas-address: ${CAS_ADDRESS}
  cas-policy-env:
    - {name: SCONE_VERSION, value: "1"}
  container-env:
    - {name: SCONE_VERSION, value: "1"}
    - {name: SCONE_SYSLIBS, value: "1"}
    - {name: SCONE_PRODUCTION, value: "0"}
    - {name: SCONE_HEAP, value: "1G"}
  permissive: true
  encrypted-cas-policy: false
  tee-type: ${TEE_TYPE}
  scone-enclave: ${SCONE_ENCLAVE}
  scone-version: ${SCONE_RUNTIME_VERSION}
  scone-runtime-image: ${SCONE_RUNTIME_IMAGE}
  trusted-cvm-signer-keys: ${CVM_SIGNING_KEY_FILE}
