name: Test Examples on Self-Hosted Runner

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-examples-self-hosted
  cancel-in-progress: false

jobs:
  run-all-examples:
    name: Run all examples in SGX and CVM mode
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    container:
      # Pinned: 6.0.8 ships scone-td-build 0.4.0, tplenv and retry-spinner; the
      # unpinned image later dropped them.
      image: registry.scontain.com/workshop/scone:6.0.8@sha256:9456916650e3a0b7625ead65c30eb181ced3442e465f0746d7d2706dc1e3f99e
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
      options: --user 0 --volume /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 240
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      KUBECONFIG: /tmp/kubeconfig
      # The runner sets HOME=/github/home in job containers; keep the image's
      # root toolchain (rustup default stable) reachable.
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
      # image-signing's skopeo push reads this file; point it at this job's
      # docker login, not whatever /github/home holds from earlier jobs.
      REPO_CREDENTIALS: /root/.docker/config.json
      REGISTRY: registry.scontain.com
      IMAGE_PULL_SECRET_NAME: sconeapps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # k8s-scone-images also holds the released demo images. Give every image
      # CI builds a run-unique tag, so a CI run never overwrites a released tag.
      - name: Use CI-unique image tags
        run: |
          suffix="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E "s#(registry\.scontain\.com/k8s-scone-images/[A-Za-z0-9._-]+):([A-Za-z0-9._-]+)#\1:\2-${suffix}#g" \
            */Values.yaml image-signing/manifest.job.yaml
          if grep -hE 'k8s-scone-images/[A-Za-z0-9._-]+:' */Values.yaml image-signing/manifest.job.yaml | grep -v -- "-${suffix}"; then
            echo "An image reference kept a released tag" >&2
            exit 1
          fi

      - name: Validate required GitHub secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          [[ -n "$KUBECONFIG_B64" ]] || { echo "Missing required secret KUBECONFIG_B64" >&2; exit 1; }
          [[ -n "$REGISTRY_USER" ]] || { echo "Missing required secret REGISTRY_USER" >&2; exit 1; }
          [[ -n "$REGISTRY_TOKEN" ]] || { echo "Missing required secret REGISTRY_TOKEN" >&2; exit 1; }

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl cluster-info

      - name: Check container toolchain
        run: |
          for cmd in bash docker kubectl scone scone-td-build tplenv retry-spinner openssl jq curl cargo skopeo cosign; do
            command -v "$cmd" >/dev/null 2>&1 || {
              echo "Missing required command: $cmd" >&2
              exit 1
            }
          done

      - name: Log Docker into the registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          # docker stores the login under DOCKER_CONFIG (/root/.docker), but
          # scone-td-build reads $HOME/.docker, and the runner sets HOME to
          # /github/home. Link it (no copy: /github/home lives on the host).
          if [[ "$HOME" != /root ]]; then
            if [[ -e "$HOME/.docker" && ! -L "$HOME/.docker" ]]; then
              echo "::warning::$HOME/.docker already exists from an earlier job on this runner; moving it aside"
              mv "$HOME/.docker" "$HOME/.docker.stale-${GITHUB_RUN_ID}"
            fi
            ln -sfn /root/.docker "$HOME/.docker"
          fi

      # scone-td-build pulls the SCONE packages image and the demo images it
      # pushed; fail early, with the cause, if the login cannot read them.
      - name: Check registry read access
        run: |
          docker pull --quiet registry.scontain.com/scone.cloud/scone-deb-pkgs:6.0.8 >/dev/null \
            || { echo "::error::The REGISTRY_USER login cannot pull scone.cloud/scone-deb-pkgs:6.0.8 (needs read_registry)"; exit 1; }

      - name: Prepare SGX values and cluster secrets
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PULL_SECRET_NAME: ${{ env.IMAGE_PULL_SECRET_NAME }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./scripts/prepare-example-ci.sh --mode sgx --namespace "ci-td-build-${{ github.run_id }}-${{ github.run_attempt }}-sgx"

      - name: Run all examples in SGX mode
        id: sgx
        continue-on-error: true
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./scripts/run-all-demos.sh --continue-on-failure

      - name: Prepare CVM values and cluster secrets
        if: always()
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PULL_SECRET_NAME: ${{ env.IMAGE_PULL_SECRET_NAME }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./scripts/prepare-example-ci.sh --mode cvm --namespace "ci-td-build-${{ github.run_id }}-${{ github.run_attempt }}-cvm"

      - name: Run all examples in CVM mode
        id: cvm
        if: always()
        continue-on-error: true
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: ./scripts/run-all-demos.sh --continue-on-failure

      # Why CVM Jobs never complete: show where their pods were scheduled.
      - name: Show CVM pod placement
        if: always() && steps.cvm.outcome == 'failure'
        run: |
          ns="ci-td-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cvm"
          kubectl get nodes -o wide --show-labels | cut -c1-400 || true
          kubectl get pods -n "$ns" -o wide || true
          for pod in $(kubectl get pods -n "$ns" -o name | head -3); do
            kubectl describe -n "$ns" "$pod" | sed -n '/^Node-Selectors/,/^Events/p;/^Events/,$p' | head -40 || true
          done

      # SGX gates the job. CVM keeps running and reporting, but is
      # non-blocking until the test cluster's CVM node runs the demos.
      - name: Fail workflow if SGX mode failed
        if: always()
        run: |
          echo "SGX outcome: ${{ steps.sgx.outcome }}"
          echo "CVM outcome: ${{ steps.cvm.outcome }} (non-blocking)"
          if [[ "${{ steps.cvm.outcome }}" != "success" ]]; then
            echo "::warning::CVM demos did not all pass; this does not fail the job"
          fi
          [[ "${{ steps.sgx.outcome }}" == "success" ]]

      # The job builds on the runner host's Docker engine (shared with other
      # jobs), so remove exactly the images this run tagged. Never prune.
      - name: Remove this run's demo images
        if: always()
        run: |
          suffix="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -F -- "-${suffix}" | xargs -r docker rmi || true

      # Each run deploys into its own namespaces, so leftovers from an earlier
      # run (immutable Jobs, old Deployments) never collide with this one.
      - name: Delete this run's demo namespaces
        if: always()
        run: |
          for mode in sgx cvm; do
            kubectl delete namespace "ci-td-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${mode}" --ignore-not-found --wait=false || true
          done

      - name: Clean up runner credentials
        if: always()
        run: |
          docker logout "$REGISTRY" || true
          [[ -L "$HOME/.docker" ]] && rm -f "$HOME/.docker" || true
          rm -f "$KUBECONFIG" || true
