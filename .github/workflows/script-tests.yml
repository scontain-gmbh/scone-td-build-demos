name: Script tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  script-tests:
    name: Workshop script tests (no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated scripts parse
        run: for f in scripts/*.sh docs/*.sh; do bash -n "$f"; done
      - name: Run script tests
        run: make test
