name: Script tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  script-tests:
    name: Workshop script tests (no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tplenv
        run: cargo install tplenv --version 0.11.0 --locked
      # scripts/ and docs/ are generated from the READMEs. Fail if one was edited by hand
      # or a README changed without regenerating them, so CI tests what the READMEs say.
      - name: Check that the generated scripts are up to date
        run: |
          ./scripts/extract-all-scripts.sh -y
          git diff --exit-code -- scripts docs
      - name: Check generated scripts parse
        run: for f in scripts/*.sh docs/*.sh; do bash -n "$f"; done
      - name: Run script tests
        run: make test
